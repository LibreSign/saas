name: Compose configuration

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - name: Validate Compose configuration
        run: make test-config

      - name: Validate optional local override example
        run: |
          cp docker-compose.override.example.yml docker-compose.override.yml
          make test-config

  # Disposable GitHub-hosted runner: no shared developer volumes or credentials.
  startup-integration:
    name: Fresh-clone startup and integration
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: compose-config
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - name: Start the complete stack
        run: make up

      - name: Verify HTTPS, authenticated API, app activation and idempotency
        run: make test

      - name: Collect logs on failure
        if: failure()
        run: |
          docker compose -f site/docker-compose.yml logs --tail 80 --no-color || true
          docker compose -f wordpress-docker/docker-compose.yml -f docker-compose.saas.yml logs --tail 80 --no-color || true
          docker compose -f nextcloud-development/docker-compose.yml logs --tail 80 --no-color || true
